[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apifuzz-lab"
version = "0.2.0"
description = "Scoped API endpoint discovery and evidence-based authorization checks"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.0,<3", "rich>=13.7.0,<15"]

[project.optional-dependencies]
dev = ["Flask>=3.0.0,<4", "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.15,<1", "pip-audit>=2.9,<3"]

[project.scripts]
apifuzz = "apifuzz.cli:main"

[tool.setuptools.packages.find]
include = ["apifuzz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
